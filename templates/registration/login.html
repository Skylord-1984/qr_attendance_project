<!DOCTYPE html>
<html>
<head>
    <title>SmartAttend Login</title>
</head>
<body>

    <h2>SmartAttend Login</h2>

    {% if form.errors %}
        <p>Invalid username or password.</p>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <p>
            <label>Username:</label>
            {{ form.username }}
        </p>

        <p>
            <label>Password:</label>
            {{ form.password }}
        </p>

        <button type="submit">Login</button>
    </form>

</body>
</html>
