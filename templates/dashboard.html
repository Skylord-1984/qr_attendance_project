<!DOCTYPE html>
<html>
<head>
    <title>SmartAttend Dashboard</title>
</head>
<body>

    <h1>Welcome to SmartAttend</h1>

    <h2>Hello, {{ request.user.username }}!</h2>

    <h3>Your Role: {{ request.user.role }}</h3>

    <p>You are successfully logged in.</p>

    <form method="POST" action="{% url 'logout' %}">
        {% csrf_token %}
        <button type="submit">Logout</button>
    </form>

</body>
</html>
